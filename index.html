<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Language Predictor</title>
</head>
<body>
  <h2>Sign Language Video Uploader</h2>

  <form id="upload-form">
    <input type="file" id="video" name="video" accept="video/mp4" required />
    <br /><br />
    <button type="submit">Upload and Predict</button>
  </form>

  <p id="result"></p>

  <script>
    const form = document.getElementById("upload-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const videoFile = document.getElementById("video").files[0];
      if (!videoFile) {
        alert("Please select a video file first!");
        return;
      }

      const formData = new FormData();
      formData.append("video", videoFile);

      result.textContent = "Uploading and predicting...";

      try {
        const res = await fetch("https://hand-skeleton-api-725163779003.us-west1.run.app/predict", {
          method: "POST",
          body: formData
        });

        const json = await res.json();

        if (json.prediction) {
          result.textContent = `Prediction result: ${json.prediction}`;
        } else {
          result.textContent = `Error: ${json.error || "Unknown error"}`;
        }

      } catch (err) {
        result.textContent = `Network Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
